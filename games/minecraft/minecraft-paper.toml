# Minecraft: Paper (renamed from minecraft.toml). Each Minecraft flavour gets its
# own nest file so templates can be versioned independently.

id = "minecraft-paper"
name = "Minecraft Paper"
author = "RabbiCtyl"
description = "Paper Edition servers"

[[egg]]
id = "paper"
name = "Minecraft Paper"
description = "Paper, the high performance Minecraft: Java Edition server."
docker_image = "ghcr.io/pterodactyl/yolks:java_21"
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl
curl -fsSL -o "${SERVER_JARFILE}" "https://api.papermc.io/v2/projects/paper/versions/${MC_VERSION}/builds/latest/downloads/paper-${MC_VERSION}-latest.jar"
echo "Installed ${SERVER_JARFILE}"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "26.3"
